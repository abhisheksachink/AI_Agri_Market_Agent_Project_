version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - agri-network

  # AI Service (Python FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      MONGO_URI: mongodb://root:password@mongodb:27017/agri_market_db
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    networks:
      - agri-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # Backend (Node.js Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      MONGO_URI: mongodb://root:password@mongodb:27017/agri_market_db
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - ai-service
    networks:
      - agri-network
    command: npm run dev

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_AI_SERVICE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - agri-network

volumes:
  mongodb_data:

networks:
  agri-network:
    driver: bridge
